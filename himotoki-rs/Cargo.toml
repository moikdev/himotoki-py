[workspace]
resolver = "2"
members = [
    "crates/himotoki-core",
    "crates/himotoki-cli",
    "crates/xtask",
    "crates/himotoki-py",
    "crates/himotoki-load",
]

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
fst = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
indexmap = "2"
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
